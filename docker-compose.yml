services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vzdr
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vzdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o papel da aplicacao na primeira subida (ADR-0006). Em banco ja
      # existente, use `make db-papeis`.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vzdr"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
