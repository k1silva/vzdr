[project]
name = "core-domain"
version = "0.1.0"
description = "Dominio puro: modelos, maquina de estados. Sem IO."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Roda no hypervisor: alvo de EXECUCAO 3.9. Nao use sintaxe 3.10+.
# A restricao e por pacote, nao do projeto inteiro — ver ADR-0007.
extend = "../../pyproject.toml"
target-version = "py39"

[tool.setuptools.package-data]
# PEP 561: o marcador viaja com o pacote, senao quem importa `vzdr.*` de fora
# do repositorio recebe Any em silencio (ignore_missing_imports e global).
"*" = ["py.typed"]
