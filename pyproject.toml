[project]
name = "vzdr"
version = "0.1.0"
description = "Plataforma de operacao de infraestrutura VHI"
requires-python = ">=3.9"

[tool.ruff]
# Alvo de EXECUCAO: 3.9, a versao dos hypervisors. Nao use sintaxe 3.10+.
target-version = "py39"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vzdr"]

[tool.mypy]
# Se o mypy reclamar que 3.9 e antigo demais, suba AQUI para "3.10" e mantenha
# o ruff em py39 — o ruff e quem garante a compatibilidade de sintaxe.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/core-domain/src:packages/core-connections/src:packages/core-jobs/src:packages/core-agents/src:packages/core-inventory/src:packages/core-events/src:packages/core-api/src:packages/tool-dr/src:packages/agent/src:packages/cli/src"

[[tool.mypy.overrides]]
module = "vzdr.core.domain.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: exige PostgreSQL local (make db-up)",
    "integration: exige libvirt e qemu reais",
    "e2e: exige dois clusters de laboratorio",
]
