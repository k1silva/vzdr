[project]
name = "core-audit"
version = "0.1.0"
description = "Auditoria: quem fez o que, quando, em qual tenant."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
