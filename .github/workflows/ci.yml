name: CI

# A CI chama alvos do Makefile e nao repete os comandos deles.
# Foi a repeticao que deixou o `psycopg` no `make setup` e fora do YAML:
# dois lugares definindo como se roda o projeto, e um deles desatualizou.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambiente
        run: make setup

      - name: Lint, tipos, testes e invariantes
        run: make check

  banco:
    runs-on: ubuntu-latest

    services:
      # Os mesmos valores do docker-compose.yml, que e o que roda local.
      # O GitHub nao le compose, entao aqui repetem — se mudar la, mude aqui.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vzdr
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: vzdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vzdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Senha de laboratorio, a mesma do docker-compose.yml. Nao ha padrao no
    # codigo: `make test-db` cria o papel da aplicacao e precisa dela aqui,
    # porque o service container do GitHub nao roda o script de init.
    env:
      VZDR_SENHA_APP: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambiente
        run: make setup

      - name: Testes com banco
        run: make test-db

  # O ruff e o checador dizem que a INTENCAO e 3.9. Este job verifica o FATO:
  # instala 3.9 de verdade e EXECUTA, sob ele, os testes do que roda no
  # hypervisor. So compilar deixava passar chamada 3.10+ de sintaxe valida, e
  # repetia o comando aqui em vez de chamar o Makefile. Ver ADR-0007.
  alvo-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As duas: o 3.11 monta o .venv que deriva o fecho; o 3.9 e o que executa.
      # A ultima da lista e o `python3` padrao, e o `make setup` precisa do 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.11

      - name: Ambiente
        run: make setup

      - name: Testes do fecho sob Python 3.9 real
        run: make test-py39 PY39=python3.9
