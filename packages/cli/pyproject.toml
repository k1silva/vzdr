[project]
name = "cli"
version = "0.1.0"
description = "CLI, cliente da mesma API que a interface consome."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: o marcador viaja com o pacote, senao quem importa `vzdr.*` de fora
# do repositorio recebe Any em silencio (ignore_missing_imports e global).
"*" = ["py.typed"]
